services:
  postgres:
    image: postgres:16-alpine
    container_name: mirrage-postgres
    restart: unless-stopped
    # Use .env.production file instead of hardcoded secrets
    env_file: .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mirrage_user} -d $${POSTGRES_DB:-mirrage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mirrage-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # A .env.production file must be created from .env.example
    env_file: .env.production
    ports:
      - "8000:8000"

volumes:
  postgres_data:
