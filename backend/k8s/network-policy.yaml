apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-player-sessions
  namespace: mirrage-sessions
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mirrage-session
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic only from OpenVPN gateway subnet (10.8.0.0/24)
    - from:
        - ipBlock:
            cidr: 10.8.0.0/24
      ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 2222
  egress:
    # Restrict egress so sandbox pods cannot scan the host network or internet
    - to:
        - ipBlock:
            cidr: 10.8.0.0/24
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
