apiVersion: v1
kind: Namespace
metadata:
  name: mirrage-sessions
  labels:
    mirrage.io/purpose: player-sandboxes
---
apiVersion: v1
kind: Pod
metadata:
  name: session-sample-template
  namespace: mirrage-sessions
  labels:
    app.kubernetes.io/name: mirrage-session
    mirrage.io/session-id: session-template
    mirrage.io/user-id: user-template
spec:
  restartPolicy: Never
  containers:
    # -------------------------------------------------------------
    # Container 1: Mirage Honeypot (Management SSH on Port 2222)
    # The decoy/management environment.
    # -------------------------------------------------------------
    - name: mirage-honeypot
      image: mirrage/mirage-honeypot:latest
      ports:
        - containerPort: 2222
          name: mirage-ssh
      resources:
        limits:
          cpu: "200m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
          add:
            - SYS_CHROOT
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - KILL
            - AUDIT_WRITE
            - NET_BIND_SERVICE
      env:
        - name: SESSION_ID
          value: "session-template"
        - name: PLAYER_USERNAME
          value: "player"

    # -------------------------------------------------------------
    # Container 2: CTF Challenge Core (Player Access: SSH 22, HTTP 80)
    # The real target environment containing the challenge.
    # -------------------------------------------------------------
    - name: ctf-core
      image: mirrage/ctf-core:latest
      ports:
        - containerPort: 22
          name: ctf-ssh
        - containerPort: 80
          name: ctf-http
      resources:
        limits:
          cpu: "300m"
          memory: "512Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
          add:
            - SYS_CHROOT
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - KILL
            - AUDIT_WRITE
            - NET_BIND_SERVICE
      env:
        - name: SESSION_ID
          value: "session-template"
        - name: PLAYER_USERNAME
          value: "player"
